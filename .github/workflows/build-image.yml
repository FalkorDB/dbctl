name: Build Go Image (No Push)

on:
  push:
    branches:
      - main
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: |
            falkordb/kubeblocks-dbctl:ci-${{ github.sha }}

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: falkordb/kubeblocks-dbctl:ci-${{ github.sha }}
          only-fixed: true
          severity-cutoff: high
          # Report-only until existing vulnerabilities are fixed; set to true to gate builds.
          fail-build: false
          cache-db: true

      - name: Show Grype results
        if: always() && steps.grype.outputs.sarif != ''
        run: |
          jq -r '.runs[0].results[] | "| \(.ruleId) | \(.level) | \(.message.text | split("\n")[0]) |"' \
            "${{ steps.grype.outputs.sarif }}" > grype-rows.md || true
          {
            echo "### Grype scan: $(wc -l < grype-rows.md) fixable findings"
            echo
            echo "| ID | Level | Summary |"
            echo "| --- | --- | --- |"
            head -n 200 grype-rows.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grype results to code scanning
        # Fork PRs get a read-only token and cannot upload SARIF.
        if: always() && steps.grype.outputs.sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image
