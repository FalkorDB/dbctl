name: Build Go Image (No Push)

on:
  push:
    branches:
      - main
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Docker image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: |
            falkordb/kubeblocks-dbctl:ci-${{ github.sha }}

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: falkordb/kubeblocks-dbctl:ci-${{ github.sha }}
          only-fixed: true
          severity-cutoff: high
          # Report-only until existing vulnerabilities are fixed; set to true to gate builds.
          fail-build: false
          cache-db: true

      - name: Show Grype results
        if: always() && steps.grype.outputs.sarif != ''
        # The SARIF holds every fixable finding; the summary lists only high and critical ones.
        run: |
          jq -r '.runs[0].results[]
            | (.message.text | capture("^A (?<sev>critical|high) vulnerability"; "i")?) as $m
            | select($m != null)
            | "| \(.ruleId) | \($m.sev) | \(.message.text | split("\n")[0]) |"' \
            "${{ steps.grype.outputs.sarif }}" > grype-rows.md || true
          {
            echo "### Grype scan: $(wc -l < grype-rows.md) fixable high/critical findings"
            echo
            echo "| ID | Severity | Summary |"
            echo "| --- | --- | --- |"
            head -n 200 grype-rows.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grype results to code scanning
        # Fork PRs get a read-only token and cannot upload SARIF.
        if: always() && steps.grype.outputs.sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image
