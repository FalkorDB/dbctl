
name: Build and Publish Go Image


on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The version of the release image'
        required: true
        default: 'latest'
  release:
    types:
      - published


env:
  RELEASE_VERSION: ${{ github.ref_name }}


run-name: build and publish Go image ${{ inputs.release_version }} ${{ github.ref_name }}


jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.get_release_version.outputs.release_version }}
    steps:
      - name: Get Release Version
        id: get_release_version
        run: |
          RELEASE_VERSION=${{ inputs.release_version }}
          if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          fi
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

  scan-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Layers are cached per platform so the publish job reuses this build instead of rebuilding.
      - name: Build image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: falkordb/kubeblocks-dbctl:scan-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }},ignore-error=true

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: falkordb/kubeblocks-dbctl:scan-${{ matrix.arch }}
          only-fixed: true
          severity-cutoff: high
          # Report-only until existing vulnerabilities are fixed; set to true to block releases.
          fail-build: false
          cache-db: true

      - name: Upload Grype results to code scanning
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-release-image-${{ matrix.arch }}

  build-and-push-image:
    needs: [release-version, scan-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64
          tags: |
            falkordb/kubeblocks-dbctl:${{ needs.release-version.outputs.release-version }}
            falkordb/kubeblocks-dbctl:latest
